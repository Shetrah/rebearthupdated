<!DOCTYPE html>
<html>
<head>
  <title>Rebearth M-Pesa Payment</title>
</head>
<body>
  <h2>Pay with M-Pesa</h2>
  <form id="paymentForm">
    <label>Phone Number (254...):</label><br />
    <input type="text" id="phone" required><br /><br />
    
    <label>Amount:</label><br />
    <input type="number" id="amount" required><br /><br />
    
    <button type="submit">Pay Now</button>
  </form>
  <h3>Simulate C2B Payment</h3>
<form id="simulateForm">
  <button type="submit">Simulate C2B</button>
</form>

<script>
  document.getElementById('simulateForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const res = await fetch('/simulate-c2b', { method: 'POST' });
    const data = await res.json();
    alert(JSON.stringify(data, null, 2));
  });
</script>


  <p id="response"></p>

  <script>
    const form = document.getElementById('paymentForm');
    const responseDisplay = document.getElementById('response');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value;
      const amount = document.getElementById('amount').value;

      try {
        const res = await fetch('/stkpush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount })
        });
        const data = await res.json();
        responseDisplay.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        responseDisplay.innerText = 'Error sending payment request.';
      }
    });
  </script>
</body>
</html>
